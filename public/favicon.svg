<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dropletGrad" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="dropletStroke" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="8" y1="86" x2="92" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Droplet Outer Shell -->
  <path
    d="M50 10C50 10 21 44 21 66C21 82 34 92 50 92C66 92 79 82 79 66C79 44 50 10 50 10Z"
    fill="url(#dropletGrad)"
    stroke="url(#dropletStroke)"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Bars inside droplet -->
  <rect x="34" y="66" width="6.5" height="15" rx="2" fill="url(#barGrad1)" />
  <rect x="44.5" y="58" width="6.5" height="23" rx="2" fill="url(#barGrad2)" />
  <rect x="55" y="50" width="6.5" height="31" rx="2" fill="url(#barGrad3)" />

  <!-- Upward Trend Line & Nodes -->
  <polyline
    points="31,73 48,61 68,43"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="31" cy="73" r="3.2" fill="#0284C7" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="48" cy="61" r="3.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="68" cy="43" r="4.2" fill="#F97316" stroke="#FFFFFF" stroke-width="2.2" />

  <!-- Orbit Swirl -->
  <path
    d="M10 82C18 96 46 97 68 93C83 90 92 82 92 76C92 68 78 67 66 69"
    stroke="url(#swooshGrad)"
    stroke-width="3"
    stroke-linecap="round"
    fill="none"
  />
</svg>
